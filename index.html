<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Suenyo OS"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Suenyo OS</title>
<style>
:root{--bg:#f5f5f3;--surface:#fff;--ink:#171717;--muted:#777;--line:#e9e9e6;--accent:#dce9f4;--accent2:#f2e3ee;--accent3:#e4eddf;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--ink);transition:.15s}button:hover{background:#f1f1ef}button.primary{background:#171717;color:#fff;border-color:#171717}button.primary:hover{background:#333}input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:white;outline:none;width:100%;min-width:0}input:focus,select:focus,textarea:focus{border-color:#999}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}small,.muted{color:var(--muted)}.layout{display:flex;min-height:100vh}.sidebar{width:236px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:16px;position:fixed;inset:0 0 0 0;z-index:3}.brand{font-weight:800;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;padding:5px 9px 14px}.brandmark{background:#111;color:white;border-radius:9px;width:30px;height:30px;display:grid;place-items:center}.navgroup{display:flex;flex-direction:column;gap:4px}.navbtn{display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;color:#555;font-size:14px}.navbtn.active{background:#f1f1ef;color:#111;font-weight:650}.navbtn .ico{width:20px;text-align:center}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.main{margin-left:236px;flex:1;min-width:0;padding:24px 30px 80px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.search{max-width:420px;display:flex;gap:8px;align-items:center}.top-actions{display:flex;gap:8px}.page-title{font-size:27px;font-weight:750;letter-spacing:-.04em;margin:0 0 4px}.sub{color:var(--muted);margin-bottom:22px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px}.stat{font-size:28px;font-weight:750;margin-top:8px}.statlabel{font-size:13px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px}.sectionhead h2{font-size:16px;margin:0}.row{display:flex;gap:10px;align-items:center}.stack{display:flex;flex-direction:column;gap:10px}.listitem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.listitem .grow{flex:1;min-width:0}.badge{font-size:11px;padding:4px 8px;border-radius:99px;background:#f1f1ef;white-space:nowrap}.badge.blue{background:#e3edf7}.badge.pink{background:#f3e5f0}.badge.green{background:#e5efe3}.badge.orange{background:#f5e9db}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.toolbar input{max-width:320px}.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{margin-bottom:12px}.empty{color:var(--muted);text-align:center;padding:30px}.mobilebar{display:none}.modalbg{position:fixed;inset:0;background:#0005;display:grid;place-items:center;z-index:10;padding:18px}.modal{background:white;border-radius:18px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal h3{margin-top:0}.pillbtn{border-radius:99px}.done{text-decoration:line-through;opacity:.55}.danger{color:#b33}.quote-line{display:grid;grid-template-columns:2fr 70px 100px 80px;gap:8px;align-items:center;margin-bottom:8px}.footnote{font-size:11px;color:var(--muted);margin-top:20px}
@media(max-width:900px){.sidebar{width:205px}.main{margin-left:205px;padding:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.sidebar{display:none}.main{margin:0;padding:16px 14px 92px}.topbar{margin-bottom:18px}.search{max-width:none;flex:1}.search input{font-size:13px}.top-actions button:not(.primary){display:none}.page-title{font-size:24px}.grid{gap:9px}.card{padding:13px}.stat{font-size:24px}.grid2{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;z-index:5}.mobilebar button{border:0;background:transparent;padding:8px 4px;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:54px}.mobilebar .create{background:#111;color:white;border-radius:13px;font-size:20px;width:42px;min-width:42px;height:42px;justify-content:center}.formrow{grid-template-columns:1fr}.listitem{padding:10px}.quote-line{grid-template-columns:1fr 55px 75px 65px}.sectionhead{margin-top:20px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><span class="brandmark">S</span> SUENYO OS</div><div class="navgroup" id="nav"></div><div class="sidebottom"><button class="navbtn" data-page="settings"><span class="ico">⚙</span> Paramètres</button><div style="padding:8px 10px;color:#999;font-size:11px">WORKSPACE · SUENYO ORCHESTRA</div></div></aside><main class="main"><div class="topbar"><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Rechercher partout…"></div><div class="top-actions"><button onclick="openCreate()">＋ Créer</button><button onclick="showPage('settings')">⚙</button></div></div><div id="content"></div></main></div><nav class="mobilebar"><button onclick="showPage('dashboard')">⌂<span>Accueil</span></button><button onclick="showPage('events')">▣<span>Événements</span></button><button class="create" onclick="openCreate()">＋</button><button onclick="showPage('crm')">♙<span>CRM</span></button><button onclick="showPage('more')">☰<span>Plus</span></button></nav><div id="modalhost"></div>
<script>
const navItems=[['dashboard','⌂','Dashboard'],['agenda','▦','Agenda'],['events','▣','Événements'],['crm','♙','Clients / CRM'],['artists','♫','Artistes'],['quotes','▤','Devis'],['finance','€','Finances'],['tasks','☑','Tâches'],['documents','▧','Documents'],['travel','✈','Logistique'],['notes','✎','Notes / Inbox']];
let db=JSON.parse(localStorage.getItem('suenyoOS')||'null')||{events:[],clients:[],artists:[],quotes:[],finance:[],tasks:[],documents:[],travel:[],notes:[],activity:[]};let page='dashboard';let modal='';
function save(){localStorage.setItem('suenyoOS',JSON.stringify(db));}
function logActivity(msg){db.activity.unshift({msg,at:new Date().toLocaleString('fr-FR')});db.activity=db.activity.slice(0,100);save();}
function navRender(){document.getElementById('nav').innerHTML=navItems.map(([id,icon,label])=>`<button class="navbtn ${page===id?'active':''}" data-page="${id}"><span class="ico">${icon}</span>${label}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));}
function showPage(p){page=p;navRender();render();}
function head(title,sub=''){return `<h1 class="page-title">${title}</h1><div class="sub">${sub}</div>`}
function card(label,value,desc=''){return `<div class="card"><div class="statlabel">${label}</div><div class="stat">${value}</div>${desc?`<small>${desc}</small>`:''}</div>`}
function item(title,subtitle='',badge='',actions=''){return `<div class="listitem"><div class="grow"><strong>${esc(title)}</strong>${subtitle?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(subtitle)}</div>`:''}</div>${badge?`<span class="badge">${esc(badge)}</span>`:''}${actions}</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){let c=document.getElementById('content');switch(page){case'dashboard':c.innerHTML=dashboard();break;case'agenda':c.innerHTML=agenda();break;case'events':c.innerHTML=eventsPage();break;case'crm':c.innerHTML=crmPage();break;case'artists':c.innerHTML=artistsPage();break;case'quotes':c.innerHTML=quotesPage();break;case'finance':c.innerHTML=financePage();break;case'tasks':c.innerHTML=tasksPage();break;case'documents':c.innerHTML=docsPage();break;case'travel':c.innerHTML=travelPage();break;case'notes':c.innerHTML=notesPage();break;case'settings':c.innerHTML=settingsPage();break;case'more':c.innerHTML=morePage();break;default:c.innerHTML=dashboard();}wire();}
function dashboard(){let openTasks=db.tasks.filter(t=>!t.done).length;let upcoming=db.events.filter(e=>e.status!=='Terminé'&&e.status!=='Annulé').length;let due=db.finance.filter(f=>f.type==='Entrée'&&!f.paid).reduce((s,f)=>s+Number(f.amount||0),0);return `${head('Dashboard','Bienvenue dans votre espace Suenyo Orchestra.')}<div class="grid">${card('Événements actifs',upcoming)}${card('Tâches ouvertes',openTasks)}${card('Clients',db.clients.length)}${card('À encaisser',due.toLocaleString('fr-FR',{style:'currency',currency:'EUR'}))}</div><div class="sectionhead"><h2>Prochains événements</h2><button onclick="showPage('events')">Voir tout →</button></div><div class="stack">${db.events.slice(0,5).map(e=>item(e.name,`${e.date||'Date à définir'} · ${e.city||''}`,e.status)).join('')||'<div class="card empty">Aucun événement pour le moment. Créez votre premier événement.</div>'}</div><div class="sectionhead"><h2>À faire</h2><button onclick="showPage('tasks')">Toutes les tâches →</button></div><div class="stack">${db.tasks.filter(t=>!t.done).slice(0,4).map(t=>item(t.title,`${t.assignee} · ${t.due||'Sans échéance'}`,t.priority)).join('')||'<div class="card empty">Aucune tâche ouverte.</div>'}</div>`}
function agenda(){return `${head('Agenda','Vue simplifiée des événements à venir.')}<div class="stack">${db.events.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(e=>item(e.date||'Date à définir',e.name+' · '+(e.city||''),e.status)).join('')||'<div class="card empty">Pas d’événement enregistré.</div>'}</div>`}
function eventsPage(){return `${head('Événements','Vos événements et dossiers de production.')}<div class="toolbar"><button class="primary" onclick="openForm('event')">＋ Nouvel événement</button><input placeholder="Filtrer les événements" oninput="filterList(this,'eventsList')"></div><div id="eventsList" class="stack">${db.events.map((e,i)=>item(e.name,`${e.date||'Date à définir'} · ${e.city||''} · ${e.type||''}`,e.status,`<button onclick="editEventStatus(${i})">Modifier statut</button><button onclick="deleteItem('events',${i})">✕</button>`)).join('')||'<div class="card empty">Aucun événement. Créez votre premier dossier.</div>'}</div>`}
function crmPage(){return `${head('Clients & CRM','Suivez prospects, échanges et prochaines actions.')}<div class="toolbar"><button class="primary" onclick="openForm('client')">＋ Nouveau contact</button></div><div class="grid2">${['Nouveau prospect','Premier contact','Devis en préparation','Devis envoyé','Relance à faire','Négociation','Signé','Perdu'].map(st=>`<div class="card"><strong>${st}</strong><div class="stack" style="margin-top:10px">${db.clients.filter(x=>x.stage===st).map(x=>item(x.name,`${x.eventType||'Événement'} · ${x.date||''}`,x.stage,`<button onclick="moveClient(${db.clients.indexOf(x)})">⇄</button>`)).join('')||'<small class="muted">Aucun contact</small>'}</div></div>`).join('')}</div>`}
function artistsPage(){return `${head('Artistes','Roster, tarifs de base et contacts.')}<div class="toolbar"><button class="primary" onclick="openForm('artist')">＋ Ajouter un artiste</button><input placeholder="Rechercher artiste / instrument" oninput="filterList(this,'artistsList')"></div><div class="stack" id="artistsList">${db.artists.map((a,i)=>item(a.name,`${a.instrument||'Instrument'} · ${a.phone||'Tel à renseigner'} · ${a.rate||'Tarif à définir'} €`,a.status||'À contacter',`<button onclick="deleteItem('artists',${i})">✕</button>`)).join('')||'<div class="card empty">Votre base artiste est vide.</div>'}</div>`}
function quotesPage(){return `${head('Devis','Suivi commercial des propositions.')}<div class="toolbar"><button class="primary" onclick="openForm('quote')">＋ Nouveau devis</button></div><div class="stack">${db.quotes.map((q,i)=>item(q.name,`${q.amount||0} € · ${q.date||''}`,q.status,`<button onclick="deleteItem('quotes',${i})">✕</button>`)).join('')||'<div class="card empty">Aucun devis enregistré.</div>'}</div><p class="footnote">La création de PDF premium et les versions de devis seront intégrées dans une prochaine évolution.</p>`}
function financePage(){let income=db.finance.filter(x=>x.type==='Entrée').reduce((s,x)=>s+Number(x.amount||0),0);let expense=db.finance.filter(x=>x.type==='Dépense').reduce((s,x)=>s+Number(x.amount||0),0);return `${head('Finances','Encaissements et dépenses suivis par événement.')}<div class="grid">${card('Entrées enregistrées',income.toLocaleString('fr-FR',{style:'currency',currency:'EUR'}))}${card('Dépenses',expense.toLocaleString('fr-FR',{style:'currency',currency:'EUR'}))}${card('Net', (income-expense).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}))}${card('Opérations',db.finance.length)}</div><div class="sectionhead"><h2>Opérations</h2><button class="primary" onclick="openForm('finance')">＋ Ajouter</button></div><div class="stack">${db.finance.map((f,i)=>item(f.title,`${f.event||'Général'} · ${f.method||''}`,`${f.type} · ${f.amount} €`,`<button onclick="deleteItem('finance',${i})">✕</button>`)).join('')||'<div class="card empty">Aucune opération.</div>'}</div>`}
function tasksPage(){return `${head('Tâches','Actions, échéances et responsables.')}<div class="toolbar"><button class="primary" onclick="openForm('task')">＋ Nouvelle tâche</button><button onclick="filterTasks('all')">Toutes</button><button onclick="filterTasks('open')">À faire</button><button onclick="filterTasks('done')">Terminées</button></div><div class="stack" id="taskList">${db.tasks.map((t,i)=>`<div class="listitem"><input type="checkbox" style="width:18px" ${t.done?'checked':''} onchange="toggleTask(${i},this.checked)"><div class="grow ${t.done?'done':''}"><strong>${esc(t.title)}</strong><div class="muted" style="font-size:12px">${esc(t.assignee)} · ${esc(t.event||'Sans événement')} · ${esc(t.due||'Sans échéance')}</div></div><span class="badge">${esc(t.priority)}</span><button onclick="deleteItem('tasks',${i})">✕</button></div>`).join('')||'<div class="card empty">Aucune tâche.</div>'}</div>`}
function docsPage(){return `${head('Documents','Liste simple des fichiers associés à vos événements.')}<div class="toolbar"><button class="primary" onclick="openForm('document')">＋ Ajouter un document</button></div><div class="stack">${db.documents.map((d,i)=>item(d.name,`${d.event||'Général'} · ${d.category||'Non classé'}`,d.note||'Document',`<button onclick="deleteItem('documents',${i})">✕</button>`)).join('')||'<div class="card empty">Aucun document. La vraie version permettra le dépôt de fichiers.</div>'}</div>`}
function travelPage(){return `${head('Logistique & VHR','Voyages, hôtels, transferts et dépenses.')}<div class="toolbar"><button class="primary" onclick="openForm('travel')">＋ Ajouter une réservation / étape</button></div><div class="stack">${db.travel.map((t,i)=>item(t.title,`${t.event||'Général'} · ${t.details||''}`,t.type,`<button onclick="deleteItem('travel',${i})">✕</button>`)).join('')||'<div class="card empty">Aucun élément logistique.</div>'}</div>`}
function notesPage(){return `${head('Notes & Inbox','Capturer une idée et la retrouver plus tard.')}<div class="toolbar"><button class="primary" onclick="openForm('note')">＋ Nouvelle note</button></div><div class="stack">${db.notes.map((n,i)=>item(n.text,n.link||'Non liée',n.pinned?'Épinglée':'Note',`<button onclick="pinNote(${i})">⌑</button><button onclick="deleteItem('notes',${i})">✕</button>`)).join('')||'<div class="card empty">Votre inbox est vide.</div>'}</div>`}
function settingsPage(){return `${head('Paramètres','Préférences et gestion de vos données.')}<div class="grid2"><div class="card"><h3>Export de sauvegarde</h3><p class="muted">Téléchargez une copie de vos données Suenyo OS.</p><button class="primary" onclick="exportData()">Exporter JSON</button></div><div class="card"><h3>Importer une sauvegarde</h3><p class="muted">Restaurer des données depuis un fichier JSON.</p><input type="file" accept="application/json" onchange="importData(this)"></div><div class="card"><h3>Stockage local</h3><p class="muted">Vos données sont conservées dans ce navigateur/appareil pour cette version gratuite autonome.</p><button class="danger" onclick="clearData()">Effacer toutes les données</button></div><div class="card"><h3>À propos</h3><strong>Suenyo OS · Prototype gratuit</strong><p class="muted">Version locale · Données non synchronisées entre appareils.</p></div></div>`}
function morePage(){return `${head('Plus','Accéder aux autres modules.')}<div class="grid2">${navItems.filter(x=>!['dashboard','events','crm'].includes(x[0])).map(([id,ic,l])=>`<button class="card" style="text-align:left" onclick="showPage('${id}')"><strong>${ic}　${l}</strong></button>`).join('')}<button class="card" onclick="showPage('settings')">⚙　Paramètres</button></div>`}
function openCreate(){showModal(`<h3>Créer rapidement</h3><div class="stack">${[['event','Événement'],['client','Client / prospect'],['artist','Artiste'],['quote','Devis'],['task','Tâche'],['note','Note'],['finance','Opération financière']].map(([type,label])=>`<button onclick="openForm('${type}')">＋ ${label}</button>`).join('')}</div>`)}
function openForm(type){const specs={event:['Nouvel événement',[['name','Nom événement'],['type','Type'],['date','Date'],['city','Ville / lieu'],['status','Statut']]],client:['Nouveau contact',[['name','Nom'],['eventType','Type d’événement'],['date','Date prévue'],['stage','Étape CRM'],['phone','Téléphone'],['notes','Notes']]],artist:['Ajouter un artiste',[['name','Nom'],['instrument','Instrument(s)'],['phone','Téléphone / WhatsApp'],['rate','Tarif de base (€)'],['city','Ville'],['status','Statut']]],quote:['Nouveau devis',[['name','Client / événement'],['amount','Montant (€)'],['date','Date'],['status','Statut']]],task:['Nouvelle tâche',[['title','Intitulé'],['assignee','Assigné à'],['event','Événement lié'],['due','Échéance'],['priority','Priorité']]],note:['Nouvelle note',[['text','Note'],['link','À lier à']]],finance:['Nouvelle opération',[['type','Entrée ou Dépense'],['title','Intitulé'],['amount','Montant (€)'],['event','Événement'],['method','Moyen de paiement']]],document:['Ajouter document',[['name','Nom du document'],['event','Événement'],['category','Catégorie'],['note','Détails']]],travel:['Ajouter logistique',[['type','Type (Vol/Hôtel/Transfert)'],['title','Titre'],['event','Événement'],['details','Détails']]]};let [title,fields]=specs[type]||specs.note;let fieldhtml=fields.map(([key,label])=>`<div class="field"><label>${label}</label><input name="${key}" ${key==='date'?'type="date"':''} placeholder="${label}"></div>`).join('');showModal(`<h3>${title}</h3><form id="formx">${fieldhtml}<div class="row"><button type="button" onclick="closeModal()">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form>`);document.getElementById('formx').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(type==='event'){obj.status=obj.status||'Prospect';db.events.unshift(obj)}else if(type==='client'){obj.stage=obj.stage||'Nouveau prospect';db.clients.unshift(obj)}else if(type==='artist'){db.artists.unshift(obj)}else if(type==='quote'){db.quotes.unshift(obj)}else if(type==='task'){obj.priority=obj.priority||'Normale';obj.done=false;db.tasks.unshift(obj)}else if(type==='note'){obj.pinned=false;db.notes.unshift(obj)}else if(type==='finance'){db.finance.unshift(obj)}else if(type==='document'){db.documents.unshift(obj)}else if(type==='travel'){db.travel.unshift(obj)}logActivity('Création : '+title);closeModal();render();};}
function showModal(html){document.getElementById('modalhost').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modalhost').innerHTML=''}
function deleteItem(bucket,i){if(confirm('Supprimer cet élément ?')){db[bucket].splice(i,1);logActivity('Suppression dans '+bucket);render();}}
function toggleTask(i,v){db.tasks[i].done=v;save();render()}function pinNote(i){db.notes[i].pinned=!db.notes[i].pinned;save();render()}
function editEventStatus(i){let status=prompt('Nouveau statut (Prospect, Devis en cours, En attente client, Confirmé, En préparation, Prêt, Terminé, Annulé)',db.events[i].status||'Prospect');if(status){db.events[i].status=status;logActivity('Statut événement modifié');render()}}
function moveClient(i){let stages=['Nouveau prospect','Premier contact','Devis en préparation','Devis envoyé','Relance à faire','Négociation','Signé','Perdu'];let nxt=stages[(stages.indexOf(db.clients[i].stage)+1)%stages.length];db.clients[i].stage=nxt;save();render()}
function filterList(input,id){let q=input.value.toLowerCase();document.querySelectorAll('#'+id+' .listitem').forEach(el=>el.style.display=el.innerText.toLowerCase().includes(q)?'flex':'none')}
function filterTasks(mode){document.querySelectorAll('#taskList .listitem').forEach(el=>{let check=el.querySelector('input[type=checkbox]');el.style.display=mode==='all'||(mode==='open'&&!check.checked)||(mode==='done'&&check.checked)?'flex':'none'})}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='suenyo-os-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();alert('Sauvegarde importée !')}catch(e){alert('Fichier invalide')}};r.readAsText(f)}
function clearData(){if(confirm('Supprimer toutes les données locales ? Cette action est irréversible.')){db={events:[],clients:[],artists:[],quotes:[],finance:[],tasks:[],documents:[],travel:[],notes:[],activity:[]};save();render()}}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));}
document.getElementById('globalSearch').addEventListener('input',e=>{let q=e.target.value.trim().toLowerCase();if(!q)return;let matches=[];for(let key of ['events','clients','artists','quotes','tasks','documents','travel','notes']){db[key].forEach(x=>{let str=JSON.stringify(x).toLowerCase();if(str.includes(q))matches.push({key,obj:x})})}document.getElementById('content').innerHTML=head('Recherche globale',`${matches.length} résultat(s) pour « ${esc(q)} »`)+`<div class="stack">${matches.slice(0,60).map(m=>item(m.obj.name||m.obj.title||m.obj.text||'Élément',m.key,m.obj.status||m.obj.stage||'',`<button onclick="showPage('${m.key==='clients'?'crm':m.key==='documents'?'documents':m.key}')">Ouvrir</button>`)).join('')||'<div class="card empty">Aucun résultat.</div>'}`});
navRender();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
